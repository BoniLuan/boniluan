server {
    listen 8080;
    listen [::]:8080;
    server_name lume.boniluan.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://lume.boniluan.com$request_uri;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name lume.boniluan.com;

    ssl_certificate /etc/letsencrypt/live/boniluan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boniluan.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    set $lume_upstream lume-gateway:8080;

    # Financial and authentication URLs can contain sensitive input. Keep raw
    # request lines out of the shared edge logs.
    access_log off;
    error_log stderr crit;

    location = /gateway-healthz { return 404; }
    location ~ ^/(?:metrics|readyz|internal)(?:/|$) { return 404; }

    location / {
        proxy_pass http://$lume_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
        proxy_cache off;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
}
