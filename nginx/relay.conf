# Relay serves a static project page only. No API or worker upstream is exposed.
server {
  listen 8080;
  listen [::]:8080;
  server_name relay.boniluan.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 301 https://relay.boniluan.com$request_uri;
  }
}

server {
  listen 8443 ssl;
  listen [::]:8443 ssl;
  http2 on;
  server_name relay.boniluan.com;

  ssl_certificate /etc/letsencrypt/live/relay.boniluan.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/relay.boniluan.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  root /usr/share/nginx/relay;
  autoindex off;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
  add_header Cache-Control "no-cache" always;

  if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
  }

  location = / {
    try_files /index.html =404;
  }

  location ~ ^/(styles\.css|flow\.js|mark\.svg)$ {
    try_files $uri =404;
  }

  location / {
    return 404;
  }
}
