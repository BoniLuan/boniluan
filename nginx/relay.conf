# Relay institutional site, authenticated API and signed synthetic receiver.
limit_req_zone $binary_remote_addr zone=relay_requests:1m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=relay_connections:1m;
server {
  listen 8080;
  listen [::]:8080;
  server_name relay.boniluan.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 301 https://relay.boniluan.com$request_uri;
  }
}

server {
  listen 8443 ssl;
  listen [::]:8443 ssl;
  http2 on;
  server_name relay.boniluan.com;

  ssl_certificate /etc/letsencrypt/live/relay.boniluan.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/relay.boniluan.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  root /usr/share/nginx/relay;
  autoindex off;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
  add_header Cache-Control "no-store" always;

  client_max_body_size 64k;
  client_body_buffer_size 64k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 10s;
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 3s;
  # API URLs can contain caller input. Do not retain raw request lines.
  access_log off;
  error_log stderr crit;

  location = / {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    try_files /index.html =404;
  }

  location ~ ^/(styles\.css|flow\.js|mark\.svg)$ {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    try_files $uri =404;
  }

  location ^~ /api/v1/ {
    if ($request_method !~ ^(GET|HEAD|POST|DELETE)$) { return 405; }
    set $relay_api relay-public-api:8080;
    proxy_pass http://$relay_api;
    limit_req zone=relay_requests burst=20 nodelay;
    limit_req_status 429;
    limit_conn relay_connections 10;
    limit_conn_status 429;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_next_upstream off;
    proxy_cache off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_hide_header Cache-Control;
  }

  location = /demo/hook {
    if ($request_method != POST) { return 405; }
    set $relay_demo relay-demo-receiver:8080;
    proxy_pass http://$relay_demo;
    limit_req zone=relay_requests burst=20 nodelay;
    limit_req_status 429;
    limit_conn relay_connections 10;
    limit_conn_status 429;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_next_upstream off;
    proxy_cache off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_hide_header Cache-Control;
  }

  location / {
    return 404;
  }
}
