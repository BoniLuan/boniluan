services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boniluan-home
    restart: unless-stopped
    command: >-
      /bin/sh -c "while :; do sleep 21600; nginx -s reload; done & exec nginx -g \"daemon off;\""
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    networks:
      - default
      - web-proxy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  certbot:
    image: certbot/certbot:latest
    container_name: boniluan-certbot
    restart: unless-stopped
    entrypoint: /bin/sh
    command: >-
      -c "while :; do certbot renew --webroot --webroot-path /var/www/certbot --quiet; sleep 43200; done"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

volumes:
  letsencrypt:
  certbot-webroot:

networks:
  web-proxy:
    name: web-proxy
    external: true
